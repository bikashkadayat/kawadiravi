<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · KTM Kawadi</title>
    <!--
      Static, self-contained page served by the service worker when a
      navigation fails. No external CSS or fonts: it has to render with no
      network at all, which is the entire point.

      The phone number is hard-coded here rather than read from site-config
      because this file is plain HTML outside the build. It is the ONE place
      the number is duplicated — update it here whenever lib/site-config.ts
      changes. Both languages are shown since we cannot know the user's locale.
    -->
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: #1c1917;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #08341a; color: #f5f5f4; }
        .card { border-color: #1f4530; }
      }
      .card { max-width: 26rem; }
      img { width: 88px; height: 88px; border-radius: 50%; }
      h1 { margin: 1.25rem 0 0; font-size: 1.5rem; line-height: 1.3; }
      p { margin: 0.75rem 0 0; line-height: 1.6; opacity: 0.8; }
      .ne { font-size: 0.95rem; }
      .actions { margin-top: 1.75rem; display: grid; gap: 0.75rem; }
      a {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 3rem;
        border-radius: 999px;
        font-weight: 600;
        text-decoration: none;
        color: #0c0a09;
      }
      .call { background: #ffb918; }
      .wa { background: #25d366; }
      .retry {
        background: transparent;
        border: 2px solid currentColor;
        color: inherit;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="KTM Kawadi" />

      <h1>You are offline</h1>
      <p>This page needs a connection. You can still reach us by phone.</p>
      <p class="ne">तपाईं अफलाइन हुनुहुन्छ। हामीलाई फोन गर्न सक्नुहुन्छ।</p>

      <div class="actions">
        <a class="call" href="tel:+9779823525098">Call 9823525098</a>
        <!--
          The only WhatsApp link on the site that cannot go through
          lib/whatsapp.ts: this file is served straight from the cache by the
          service worker, with no React, no next-intl and no active locale to
          read. So the text is pre-encoded by hand and must be kept in sync
          with `siteConfig.whatsappMessage` — decoded it reads:
          "नमस्ते! मलाई मेरो पुराना सामान (कवाडी) बेच्नु छ। कृपया पिकअपको लागि सम्पर्क गर्नुहोस्।"
        -->
        <a
          class="wa"
          href="https://wa.me/9779823525098?text=%E0%A4%A8%E0%A4%AE%E0%A4%B8%E0%A5%8D%E0%A4%A4%E0%A5%87!%20%E0%A4%AE%E0%A4%B2%E0%A4%BE%E0%A4%88%20%E0%A4%AE%E0%A5%87%E0%A4%B0%E0%A5%8B%20%E0%A4%AA%E0%A5%81%E0%A4%B0%E0%A4%BE%E0%A4%A8%E0%A4%BE%20%E0%A4%B8%E0%A4%BE%E0%A4%AE%E0%A4%BE%E0%A4%A8%20(%E0%A4%95%E0%A4%B5%E0%A4%BE%E0%A4%A1%E0%A5%80)%20%E0%A4%AC%E0%A5%87%E0%A4%9A%E0%A5%8D%E0%A4%A8%E0%A5%81%20%E0%A4%9B%E0%A5%A4%20%E0%A4%95%E0%A5%83%E0%A4%AA%E0%A4%AF%E0%A4%BE%20%E0%A4%AA%E0%A4%BF%E0%A4%95%E0%A4%85%E0%A4%AA%E0%A4%95%E0%A5%8B%20%E0%A4%B2%E0%A4%BE%E0%A4%97%E0%A4%BF%20%E0%A4%B8%E0%A4%AE%E0%A5%8D%E0%A4%AA%E0%A4%B0%E0%A5%8D%E0%A4%95%20%E0%A4%97%E0%A4%B0%E0%A5%8D%E0%A4%A8%E0%A5%81%E0%A4%B9%E0%A5%8B%E0%A4%B8%E0%A5%8D%E0%A5%A4"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Chat with KTM Kawadi on WhatsApp"
          >WhatsApp</a
        >
        <a class="retry" href="/en">Try again</a>
      </div>
    </div>
  </body>
</html>
