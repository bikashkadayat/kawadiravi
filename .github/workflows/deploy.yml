name: Deploy to GitHub Pages

# Push to main → the live site rebuilds and redeploys. Nothing else to run.
on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# Least privilege: read the repo, publish a Pages artifact, and mint the OIDC
# token deploy-pages exchanges for permission to publish. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes an in-flight deploy so the latest commit always wins.
# `cancel-in-progress: false` on the deploy side would be safer if Pages
# rejected concurrent publishes, but cancelling is what keeps this real-time.
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 20.x resolves to 20.19+, the floor eslint-visitor-keys requires.
          # Older Node fails `npm ci` with EBADENGINE.
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Next's incremental compiler cache. Restoring it lets unchanged routes
      # skip recompilation, which is most of the speed on small content edits.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx', '**/*.css', 'data/**', 'messages/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-next-

      - name: Lint
        run: npm run lint

      # Cheap, and it is the gate on data/rates.json: Zod validates the file at
      # module load, so a malformed price fails here rather than shipping.
      - name: Typecheck
        run: npm run typecheck

      # `output: "export"` means this writes ./out — a complete static site.
      #
      # NEXT_PUBLIC_* values are inlined into the bundle at BUILD time, and a
      # static host has no runtime env. So they must be injected here — there
      # is no dashboard to set them in after the fact.
      #
      # `vars` (repo Variables), not `secrets`: a GA measurement ID and a
      # Clarity project ID are public by definition — they ship in the client
      # bundle either way. Both are optional; unset means the analytics script
      # is never emitted at all.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://ktmkawadi.bikashkadayat.com.np
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_CLARITY_ID: ${{ vars.NEXT_PUBLIC_CLARITY_ID }}
          # TODO (Bikash): create repo Variable NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION
          # with the `content` value Google Search Console gives you for the
          # HTML-tag method (Settings → Secrets and variables → Actions →
          # Variables). A Search Console token is public by design — it ships in
          # the page head — so a Variable is correct here, not a Secret.
          # While unset, no verification meta tag is emitted at all.
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}

      # Fail loudly and early if the export did not produce what Pages needs,
      # rather than publishing a broken or empty site.
      - name: Verify export output
        run: |
          set -euo pipefail
          test -f out/index.html    || { echo "::error::out/index.html missing"; exit 1; }
          test -f out/en/index.html || { echo "::error::out/en/index.html missing"; exit 1; }
          test -d out/_next         || { echo "::error::out/_next missing"; exit 1; }
          test -f out/.nojekyll     || { echo "::error::out/.nojekyll missing — Pages would strip _next/"; exit 1; }
          test -f out/CNAME         || { echo "::error::out/CNAME missing — custom domain would be dropped"; exit 1; }
          echo "Export OK: $(find out -name '*.html' | wc -l) HTML files, $(du -sh out | cut -f1) total"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Uploads ./out as the Pages artifact. `.nojekyll` inside it is what stops
      # Pages running Jekyll, which would otherwise strip the _next/ folder
      # because Jekyll ignores directories beginning with an underscore.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Publish to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          {
            echo "### Deployed to GitHub Pages :rocket:"
            echo ""
            echo "- Live site: <https://ktmkawadi.bikashkadayat.com.np>"
            echo "- Pages URL: <${{ steps.deployment.outputs.page_url }}>"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
